name: tests

on:
  push:
  pull_request:

jobs:
  octave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends octave
      - name: Run tests
        run: octave --no-gui --eval "cd tests; run_tests"
